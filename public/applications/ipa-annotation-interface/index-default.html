<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPA Hodnocení výslovnosti</title>
  <style>
    body {
        font-family: system-ui, sans-serif;
        margin: 0; padding: 0;
        display: flex; flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8f9fa;
        overflow-x: hidden;
    }

    @media (max-width: 480px) {
        body {
            justify-content: flex-start;
        }
    }

    .container {
        background: white;
        border-radius: 1rem;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        padding: 2rem;
        width: 95%;
        max-width: 420px;
        text-align: center;
        box-sizing: border-box;
    }

    h1 { font-size: 1.3rem; margin-bottom: 1rem; }

    .word { font-size: 1.5rem; font-weight: bold; }
    .ipa { font-size: 1.3rem; color: #555; margin: 0.5rem 0 1rem; }

    .btns button {
      margin: 0.3rem;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btns button:hover {
      transform: scale(1.05);
    }

    .yes { background: #28a745; color: white; }
    .no { background: #dc3545; color: white; }
    .play { background: #ff9800; color: white; }
    .nav { background: #007bff; color: white; }
    .file { background: #6f42c1; color: white; }

    .progress {
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      margin-top: 10px;
    }

    .dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
      transition: 0.2s;
    }

    .dot:hover {
      transform: scale(1.3);
    }

    .dot.correct { background: #28a745; } /* Správně */
    .dot.incorrect { background: #dc3545; } /* Špatně */
    .dot.current { border: 2px solid #007bff; } /* Aktuální */
  </style>
</head>
<body>
  <div class="container">
    <h1>Hodnocení české IPA transkripce</h1>

    <div class="word" id="word">Načtěte data...</div>
    <div class="ipa" id="ipa"></div>

    <div class="btns">
      <button class="file" id="loadBtn">📂 Načíst CSV</button>
      <button class="file" id="exportBtn">💾 Export CSV</button>
      <input type="file" id="fileInput" accept=".csv" style="display:none">
    </div>

    <div class="btns">
      <button class="nav" id="prevBtn">⬅️</button>
      <button class="play" id="playBtn">🔊 Přehrát</button>
      <button class="nav" id="nextBtn">➡️</button>
    </div>

    <div class="btns">
      <button class="yes" id="yesBtn">✅ Správně</button>
      <button class="no" id="noBtn">❌ Špatně</button>
    </div>

    <div class="progress" id="progress"></div>
    <div class="status" id="statusDots"></div>
  </div>

  <script>
    let data = [];
    let ratings = [];
    let index = 0;
    const LS_KEY = "ipa_ratings_v4";

    const wordEl = document.getElementById("word");
    const ipaEl = document.getElementById("ipa");
    const progressEl = document.getElementById("progress");
    const statusEl = document.getElementById("statusDots");

    function render() {
      if (data.length === 0) {
        wordEl.textContent = "Načtěte CSV soubor se slovy.";
        ipaEl.textContent = "";
        progressEl.textContent = "";
        statusEl.innerHTML = "";
        return;
      }

      const item = data[index];
      wordEl.textContent = item.word;
      ipaEl.textContent = `/${item.ipa}/`;
      progressEl.textContent = `Slovo ${index + 1} z ${data.length}`;
      renderDots();
    }

    function renderDots() {
      statusEl.innerHTML = "";
      data.forEach((_, i) => {
        const dot = document.createElement("div");
        dot.className = "dot";

        if (i === index) dot.classList.add("current");
        if (ratings[i] === true) dot.classList.add("correct");
        if (ratings[i] === false) dot.classList.add("incorrect");

        dot.onclick = () => {
          index = i;
          render();
        };

        statusEl.appendChild(dot);
      });
    }

    function playIPA(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "cs-CZ";
      speechSynthesis.speak(utterance);
    }

    function rate(value) {
      ratings[index] = value;
      render();
      if (index < data.length - 1) {
        index++;
        render();
      }
    }

    function nextWord() {
      if (index < data.length - 1) {
        index++;
        render();
      }
    }

    function prevWord() {
      if (index > 0) {
        index--;
        render();
      }
    }

    function parseCSV(text) {
        const lines = text.trim().split("\n");
        return lines.map(line => {
            const parts = line.split(",").map(s => s.trim());
            // 2 nebo 3 sloupce
            const [word, ipa, ratingText] = parts;
            let rating = null;
            if (ratingText) {
            const val = ratingText.toLowerCase();
            if (val.includes("správně")) rating = true;
            else if (val.includes("špatně")) rating = false;
            }
            return { word, ipa, rating };
        });
        }

        function handleFileLoad(file) {
        const reader = new FileReader();
        reader.onload = e => {
            const parsed = parseCSV(e.target.result);
            data = parsed.map(p => ({ word: p.word, ipa: p.ipa }));
            ratings = parsed.map(p => p.rating ?? null);
            index = 0;
            render();
        };
        reader.readAsText(file, "UTF-8");
        }

    function exportCSV() {
      if (data.length === 0) return alert("Žádná data k exportu!");
      const csv = data.map((item, i) => {
        const val = ratings[i] === true ? "správně"
                  : ratings[i] === false ? "špatně"
                  : "";
        return `${item.word},${item.ipa},${val}`;
      }).join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ipa_hodnoceni.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Ovládací prvky
    document.getElementById("playBtn").onclick = () => data.length && playIPA(data[index].ipa);
    document.getElementById("yesBtn").onclick = () => rate(true);
    document.getElementById("noBtn").onclick = () => rate(false);
    document.getElementById("nextBtn").onclick = nextWord;
    document.getElementById("prevBtn").onclick = prevWord;
    document.getElementById("exportBtn").onclick = exportCSV;

    // Načtení CSV
    const fileInput = document.getElementById("fileInput");
    document.getElementById("loadBtn").onclick = () => fileInput.click();
    fileInput.addEventListener("change", e => {
      const file = e.target.files[0];
      if (file) handleFileLoad(file);
    });

  </script>
</body>
</html>
